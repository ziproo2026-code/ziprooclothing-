<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <!-- Circular Badge with negative space Z -->
  <g id="badge">
    <circle cx="110" cy="120" r="90" fill="#141416" stroke="#27272a" stroke-width="2"/>
    <circle cx="110" cy="120" r="90" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Cutout / White Z -->
    <path d="M54 68 H166 V88 L98 152 H170 V172 H52 V152 L124 88 H54 Z" fill="#ffffff" />
  </g>
  
  <!-- Capital Wordmark "ZIPROO" -->
