  <!-- "since 2026" subtitle -->
  <text x="565" y="185" text-anchor="end" fill="#a1a1aa" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" letter-spacing="0.08em">since 2026</text>
  <circle cx="578" cy="178" r="4" fill="#a855f7" />
